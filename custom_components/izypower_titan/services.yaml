# ---------------------------------------------------------
# SERVICES LOCAUX (via RPC)
# ---------------------------------------------------------

set_realtime_mode:
  name: Set Real-Time Mode
  description: >
    Passe l'appareil en mode de contrôle en temps réel (Mode 4).
    Utile pour la régulation fine locale.
  fields:
    device_id:
      name: Device
      description: L'appareil à contrôler (optionnel si un seul appareil).
      required: false
      selector:
        device:
          integration: izypower_titan

set_selfconsumed_mode:
  name: Set Self-consumed Mode
  description: Passe l'appareil en mode autoconsommation (Mode 1).
  fields:
    device_id:
      name: Device
      description: L'appareil à contrôler (optionnel si un seul appareil).
      required: false
      selector:
        device:
          integration: izypower_titan

charge:
  name: Charge Battery
  description: Lance une charge forcée immédiate (Local).
  fields:
    power:
      name: Puissance
      description: Puissance de charge en Watts (bridée par la limite configurée).
      required: true
      default: 500
      selector:
        number:
          min: 0
          max: 4800
          unit_of_measurement: "W"
    soc_limit:
      name: Limite SOC
      description: Arrête la charge quand ce pourcentage est atteint.
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    device_id: &device_id_field
      name: Device
      description: L'appareil à contrôler.
      required: false
      selector:
        device:
          integration: izypower_titan

discharge:
  name: Discharge Battery
  description: Lance une décharge forcée immédiate (Local).
  fields:
    power:
      name: Puissance
      description: Puissance de décharge en Watts (bridée par la limite configurée).
      required: true
      default: 300
      selector:
        number:
          min: 0
          max: 4800
          unit_of_measurement: "W"
    device_id: *device_id_field

stop:
  name: Stop Battery
  description: Met la batterie en veille (arrête charge/décharge locale).
  fields:
    device_id: *device_id_field

# ---------------------------------------------------------
# SERVICES CLOUD (via IzyPower API)
# ---------------------------------------------------------

cloud_charge_manual:
  name: Cloud Start Charge
  description: Lance une charge manuelle via l'API Cloud (Smart IA).
  fields:
    power:
      name: Puissance
      description: Puissance de charge souhaitée.
      required: true
      default: 800
      selector:
        number:
          min: 0
          max: 4800
          unit_of_measurement: "W"
    device_id: *device_id_field

cloud_discharge_manual:
  name: Cloud Start Discharge
  description: Lance une décharge manuelle via l'API Cloud (Smart IA).
  fields:
    power:
      name: Puissance
      description: Puissance de décharge souhaitée.
      required: true
      default: 800
      selector:
        number:
          min: 0
          max: 4800
          unit_of_measurement: "W"
    device_id: *device_id_field

set_cloud_max_charge:
  name: Cloud Max Charge Limit (11009)
  description: Modifie la limite maximale de charge autorisée sur la batterie via le Cloud.
  fields:
    power:
      name: Limite Max Charge
      description: Valeur en Watts (Défaut max 800W sauf mode expert).
      required: true
      selector:
        number:
          min: 0
          max: 4800
          unit_of_measurement: "W"
    device_id: *device_id_field

set_cloud_max_discharge:
  name: Cloud Max Discharge Limit (11011)
  description: Modifie la limite maximale de décharge autorisée (bridage décharge) via le Cloud.
  fields:
    power:
      name: Limite Max Décharge
      description: Valeur en Watts (Défaut max 800W sauf mode expert). Utile pour brider à 0W en heures creuses.
      required: true
      selector:
        number:
          min: 0
          max: 4800
          unit_of_measurement: "W"
    device_id: *device_id_field

set_cloud_intelligent_mode:
  name: Cloud Intelligent Mode
  description: Repasse l'appareil en mode automatique (Smart IA) via le Cloud.
  fields:
    device_id: *device_id_field
    
set_cloud_standby_mode:
  name: Cloud Standby Mode
  description: Passe l'appareil en mode Standby (Smart IA) via le Cloud.
  fields:
    device_id: *device_id_field

set_register_7266:
  name: Set Register 7266
  description: Configure le registre 7266 (0=OFF, 1=ON) - Commande unitaire par batterie
  fields:
    value:
      name: Valeur
      description: 0 pour OFF, 1 pour ON
      required: true
      selector:
        number:
          min: 0
          max: 1
          mode: slider
    device_id:
      name: Device
      description: L'appareil à contrôler (Master ou Slave spécifique).
      required: false
      selector:
        device:
          integration: izypower_titan

set_register_led:
  name: Set LEDs Control
  description: Active ou désactive les LEDs du Titan (0=OFF, 1=ON)
  fields:
    value:
      name: Valeur
      description: 0 pour OFF, 1 pour ON
      required: true
      selector:
        number:
          min: 0
          max: 1
          mode: slider
    device_id:
      name: Device
      description: L'appareil à contrôler (Master ou Slave spécifique).
      required: false
      selector:
        device:
          integration: izypower_titan

set_soc_security:
  name: Set SOC Security (ESP)
  description: Configure le SOC de sécurité (ESP) - Registre 1142. Commande exécutée sur tous les membres du cluster.
  fields:
    value:
      name: SOC de sécurité
      description: Pourcentage de SOC minimal (5-100%)
      required: true
      selector:
        number:
          min: 5
          max: 100
          step: 5
          unit_of_measurement: "%"
    device_id:
      name: Device
      description: L'appareil à contrôler (Master du cluster).
      required: false
      selector:
        device:
          integration: izypower_titan

cluster_rebalance:
  name: Cluster Rebalance
  description: >
    Force tous les Titans du cluster à appliquer les mêmes valeurs (sans rollback).
    Utile après une intervention manuelle sur l'app Izypower native ou après un échec partiel
    de commande cluster, pour remettre tous les Titans en cohérence. Au moins un paramètre est requis.
  fields:
    soc_security:
      name: SOC de sécurité
      description: Pourcentage de SOC minimal à propager sur tous les Titans (5-100%).
      required: false
      selector:
        number:
          min: 5
          max: 100
          step: 5
          unit_of_measurement: "%"
    max_charge_power:
      name: Limite charge max
      description: Limite max de charge en Watts à propager.
      required: false
      selector:
        number:
          min: 50
          max: 4800
          unit_of_measurement: "W"
    max_discharge_power:
      name: Limite décharge max
      description: Limite max de décharge en Watts à propager.
      required: false
      selector:
        number:
          min: 100
          max: 4800
          unit_of_measurement: "W"
    device_id:
      name: Device
      description: Master du cluster (la commande s'applique ensuite à tous les membres).
      required: false
      selector:
        device:
          integration: izypower_titan
